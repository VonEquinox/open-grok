name: Build platform artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: platform-artifacts-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Build and verify Windows artifact
        shell: pwsh
        run: .\scripts\build-windows-release.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-grok-windows-x86_64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/open-grok-windows-x86_64.exe
            dist/open-grok-windows-x86_64.exe.sha256

  macos:
    name: macOS Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: platform-artifacts-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Install pinned ripgrep
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ripgrep-15.0.0-aarch64-apple-darwin.tar.gz"
          curl -fL \
            https://github.com/BurntSushi/ripgrep/releases/download/15.0.0/ripgrep-15.0.0-aarch64-apple-darwin.tar.gz \
            -o "$archive"
          printf '%s  %s\n' \
            98bb2e61e7277ba0ea72d2ae2592497fd8d2940934a16b122448d302a6637e3b \
            "$archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "GROK_TOOLS_BUNDLE_RG_PATH=$RUNNER_TEMP/ripgrep-15.0.0-aarch64-apple-darwin/rg" \
            >> "$GITHUB_ENV"

      - name: Install pinned protoc
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc-29.3-osx-aarch_64.zip"
          protoc_root="$RUNNER_TEMP/protoc-29.3"
          curl -fL \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-osx-aarch_64.zip \
            -o "$archive"
          printf '%s  %s\n' \
            2b8a3403cd097f95f3ba656e14b76c732b6b26d7f183330b11e36ef2bc028765 \
            "$archive" | shasum -a 256 -c -
          mkdir -p "$protoc_root"
          unzip -q "$archive" -d "$protoc_root"
          protoc="$protoc_root/bin/protoc"
          test "$("$protoc" --version)" = "libprotoc 29.3"
          echo "PROTOC=$protoc" >> "$GITHUB_ENV"

      - name: Build and verify macOS artifact
        shell: bash
        run: ./scripts/build-macos-release.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-grok-macos-aarch64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/open-grok-macos-aarch64
            dist/open-grok-macos-aarch64.sha256

  ubuntu-20-04:
    name: Ubuntu 20.04 x86_64
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates cmake curl file git pkg-config python3 unzip
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.93.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: platform-artifacts-ubuntu-20.04-x86_64
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Install pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          protoc_archive="$RUNNER_TEMP/protoc-29.3-linux-x86_64.zip"
          protoc_root="$RUNNER_TEMP/protoc-29.3"
          curl -fL \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip \
            -o "$protoc_archive"
          printf '%s  %s\n' \
            3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a \
            "$protoc_archive" | sha256sum -c -
          mkdir -p "$protoc_root"
          unzip -q "$protoc_archive" -d "$protoc_root"
          protoc="$protoc_root/bin/protoc"
          test "$("$protoc" --version)" = "libprotoc 29.3"
          echo "PROTOC=$protoc" >> "$GITHUB_ENV"

          rg_archive="$RUNNER_TEMP/ripgrep-15.0.0-x86_64-unknown-linux-musl.tar.gz"
          curl -fL \
            https://github.com/BurntSushi/ripgrep/releases/download/15.0.0/ripgrep-15.0.0-x86_64-unknown-linux-musl.tar.gz \
            -o "$rg_archive"
          printf '%s  %s\n' \
            253ad0fd5fef0d64cba56c70dccdacc1916d4ed70ad057cc525fcdb0c3bbd2a7 \
            "$rg_archive" | sha256sum -c -
          tar -xzf "$rg_archive" -C "$RUNNER_TEMP"
          echo "GROK_TOOLS_BUNDLE_RG_PATH=$RUNNER_TEMP/ripgrep-15.0.0-x86_64-unknown-linux-musl/rg" \
            >> "$GITHUB_ENV"

      - name: Build and verify Ubuntu 20.04 artifact
        shell: bash
        run: ./scripts/build-linux-release.sh

      - name: Upload Ubuntu 20.04 artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-grok-ubuntu-20.04-x86_64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/open-grok-ubuntu-20.04-x86_64.tar.gz
            dist/open-grok-ubuntu-20.04-x86_64.tar.gz.sha256
